<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Fase 2 Conforme & Persistence</title>
  <script src="js/data.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/documental.js"></script>
  <script src="js/app.js"></script>
  <script src="js/folderReader.js"></script>
</head>
<body>
  <h1>Test Suite: Fase 2 Conforme & Persistencia</h1>
  <div id="test-results">Iniciando pruebas...</div>
  <div id="documentalMatrixContainer"></div>
  <div id="officialReportContainer"></div>
  <div id="documentModal" class="modal"><div class="modal-window"><div id="modalDocTitle"></div><div id="modalDocBody"></div><div id="modalDocStatusBadge"></div><div id="modalDocFooterMeta"></div></div></div>

  <script>
    (async function() {
      const logs = [];
      function assert(cond, msg) {
        if (!cond) {
          throw new Error("ASSERTION FAILED: " + msg);
        }
        logs.push("✓ " + msg);
        console.log("PASS: " + msg);
      }

      try {
        const pId = "EXP-05001-test_mpio_1000m";
        const slug = "test_mpio_1000m";
        App.currentProjectId = pId;

        // Limpiar storage previo
        localStorage.clear();

        // Inicializar estructura básica de proyecto
        const proyectoData = {
          id: pId,
          slug: slug,
          municipio: "TEST MPIO",
          codMunicipio: "05001",
          subregion: "VALLE DE ABURRA",
          modalidad: "MATERIALES",
          procesoEspecial: "ORDINARIO",
          revisionSupervisor: {},
          archivosMetadata: {},
          documentosStatus: {
            itemsCumplidos: [],
            itemsSubsanar: [1, 2, 4, 5, 6],
            archivosDetectados: {}
          }
        };

        const expObj = {
          id: pId,
          slug: slug,
          municipio: "TEST MPIO",
          codMunicipio: "05001",
          subregion: "VALLE DE ABURRA",
          modalidad: "MATERIALES",
          procesoEspecial: "ORDINARIO",
          datos: proyectoData,
          revisionSupervisor: {},
          archivosFileMap: {},
          archivos: [],
          fase2: null,
          fase3: { matrizObservaciones: {}, observacionesEditadas: {} },
          auditGlobal: {}
        };

        window.proyectosAuditados = {};
        window.proyectosAuditados[pId] = expObj;
        window.SIPRO_DATA = window.SIPRO_DATA || {};
        window.SIPRO_DATA.expedientesMap = window.proyectosAuditados;
        App.currentAuditRecord = expObj;
        App.currentProject = proyectoData;

        // --- TEST 1: Auditoría inicial sin archivos (Ítem 5 faltante) ---
        let auditRes = DocumentalEngine.auditProject(proyectoData);
        let it5 = auditRes.items.find(i => Number(i.id) === 5);
        assert(it5 !== null && it5 !== undefined, "Ítem 5 existe en auditoría");
        assert(it5.conforme === false, "Ítem 5 inicialmente NO es conforme por falta de archivo");
        assert(it5.faltante === true, "Ítem 5 marcado como faltante");

        // --- TEST 2: Botón 'Conforme' en ítem sin documento ---
        DocumentalEngine.marcarConformeSupervisor(5, "Validado en campo");
        auditRes = DocumentalEngine.auditProject(proyectoData);
        it5 = auditRes.items.find(i => Number(i.id) === 5);
        assert(it5.conforme === true, "Ítem 5 pasa a CONFORME tras marcarConformeSupervisor");
        assert(it5.faltante === false, "Ítem 5 ya no figura como faltante");
        assert(it5.marcadoSupervisor === true, "Ítem 5 tiene marcadoSupervisor=true");
        assert(it5.estadoSupervisor === "CONFORME", "Ítem 5 tiene estadoSupervisor='CONFORME'");
        assert(auditRes.hallazgosCriticos.every(ci => !ci.criterio.includes("Ítem 5")), "Ítem 5 no está en hallazgosCriticos");

        // Verificar que en Fase 3 aparece en Requisitos Cumplidos y no en pendientes
        let findingsObj = ReportsEngine.collectAllFindings(proyectoData, { audit2: auditRes });
        let finding5 = findingsObj.findings.find(f => f.itemNum === "05" || f.id.includes("ITEM_05") || f.id.includes("ITEM_5"));
        let compliant5 = findingsObj.compliantItems.find(f => f.itemNum === "05" || f.id.includes("ITEM_05") || f.id.includes("ITEM_5"));
        assert(!finding5, "Ítem 5 NO aparece en hallazgos pendientes de Fase 3");
        assert(compliant5 !== undefined, "Ítem 5 aparece en requisitos cumplidos de Fase 3");
        assert(compliant5.estado === "Conforme", "Ítem 5 en Fase 3 tiene estado Conforme");

        // --- TEST 3: Botón 'No Aplica' en ítem sin documento ---
        DocumentalEngine.marcarNoAplicaSupervisor(6, "No se requiere en esta zona");
        auditRes = DocumentalEngine.auditProject(proyectoData);
        let it6 = auditRes.items.find(i => Number(i.id) === 6);
        assert(it6.conforme === true, "Ítem 6 pasa a conforme tras marcarNoAplicaSupervisor");
        assert(it6.noAplica === true, "Ítem 6 tiene noAplica=true");
        assert(it6.estadoSupervisor === "NO_APLICA", "Ítem 6 tiene estadoSupervisor='NO_APLICA'");
        assert(auditRes.hallazgosCriticos.every(ci => !ci.criterio.includes("Ítem 6")), "Ítem 6 no está en hallazgosCriticos");

        findingsObj = ReportsEngine.collectAllFindings(proyectoData, { audit2: auditRes });
        let finding6 = findingsObj.findings.find(f => f.itemNum === "06" || f.id.includes("ITEM_06"));
        let compliant6 = findingsObj.compliantItems.find(f => f.itemNum === "06" || f.id.includes("ITEM_06"));
        assert(!finding6, "Ítem 6 NO aparece en hallazgos pendientes de Fase 3");
        assert(compliant6 !== undefined, "Ítem 6 aparece en lista de cumplidos/convalidados de Fase 3");

        // --- TEST 4: Revertir calificación de supervisor a automático ---
        DocumentalEngine.revertirCalificacionSupervisor(5);
        auditRes = DocumentalEngine.auditProject(proyectoData);
        it5 = auditRes.items.find(i => Number(i.id) === 5);
        assert(it5.conforme === false, "Ítem 5 vuelve a conforme=false tras revertir");
        assert(it5.faltante === true, "Ítem 5 vuelve a faltante=true tras revertir");

        // --- TEST 5: Persistencia de Asignación de Documentos y Calificaciones ---
        const fakeFile = new File(["contenido prueba"], "Documento_Ambiental_Asignado.pdf", { type: "application/pdf" });
        await App.subirSubsanacionItem(4, pId, fakeFile, { esExistente: true });

        // Marcar de nuevo el 5 como Conforme y 6 como No Aplica
        DocumentalEngine.marcarConformeSupervisor(5, "Aprobado definitivo");
        DocumentalEngine.marcarNoAplicaSupervisor(6, "No Aplica definitivo");

        // Verificar lo guardado en localStorage
        const rawSaved = localStorage.getItem(`sipro_auditoria_${slug}`);
        assert(Boolean(rawSaved), "Existe sipro_auditoria en localStorage para el slug");
        const parsedSaved = JSON.parse(rawSaved);
        assert(parsedSaved.fase2 !== undefined, "payload contiene fase2");
        assert(parsedSaved.documentosStatus !== undefined, "payload contiene documentosStatus");
        assert(parsedSaved.documentosStatus.archivosDetectados[4] === "Documento_Ambiental_Asignado.pdf", "archivosDetectados[4] guardado correctamente");
        assert(parsedSaved.revisionSupervisor[5] !== undefined && parsedSaved.revisionSupervisor[5].estado === "CONFORME", "revisionSupervisor[5] guardado");
        assert(parsedSaved.revisionSupervisor[6] !== undefined && parsedSaved.revisionSupervisor[6].estado === "NO_APLICA", "revisionSupervisor[6] guardado");

        // --- TEST 6: Simulación de lectura de carpeta restaurando asignaciones ---
        // Simular un array de archivos de la carpeta física
        const simulatedFiles = [
          new File(["ficha"], "Ficha_Priorizacion.pdf", { type: "application/pdf" }),
          fakeFile
        ];

        // Ejecutar lectura de carpeta (sin archivo físico sipro_auditoria.json, recuperando de localStorage)
        const restoredExp = await FolderReader.readFolder(simulatedFiles, null);
        assert(restoredExp !== null && restoredExp !== undefined, "readFolder procesó exitosamente");
        assert(restoredExp.datos.documentosStatus.archivosDetectados[4] === "Documento_Ambiental_Asignado.pdf", "Asignación del Ítem 4 restaurada en documentosStatus");
        assert(restoredExp.datos.archivosFiles[4] !== undefined, "Instancia File restaurada en archivosFiles[4]");
        assert(restoredExp.revisionSupervisor[5] !== undefined && restoredExp.revisionSupervisor[5].estado === "CONFORME", "Calificación de supervisión Ítem 5 restaurada");
        assert(restoredExp.revisionSupervisor[6] !== undefined && restoredExp.revisionSupervisor[6].estado === "NO_APLICA", "Calificación de supervisión Ítem 6 restaurada");

        // Verificar que la auditoría de Fase 2 del expediente restaurado reconoce el ítem 4 asignado y 5/6 supervisor
        const restoredIt4 = restoredExp.fase2.items.find(i => Number(i.id) === 4);
        const restoredIt5 = restoredExp.fase2.items.find(i => Number(i.id) === 5);
        const restoredIt6 = restoredExp.fase2.items.find(i => Number(i.id) === 6);
        assert(restoredIt4.conforme === true, "Ítem 4 restaurado como Conforme");
        assert(restoredIt4.archivoDetectado === "Documento_Ambiental_Asignado.pdf", "Ítem 4 conserva nombre de archivo asignado");
        assert(restoredIt5.conforme === true, "Ítem 5 restaurado como Conforme (Supervisor)");
        assert(restoredIt6.conforme === true, "Ítem 6 restaurado como Conforme (No Aplica)");

        // Éxito
        const resEl = document.getElementById("test-results");
        resEl.style.color = "green";
        resEl.innerHTML = "SUCCESS: " + logs.length + " verificaciones pasaron exitosamente.<br>" + logs.join("<br>");
        console.log("SUCCESS ALL TESTS PASSED");
      } catch (err) {
        console.error("TEST FAILED:", err);
        const resEl = document.getElementById("test-results");
        resEl.style.color = "red";
        resEl.innerHTML = "FAILED: " + err.message + "<br><pre>" + err.stack + "</pre>";
      }
    })();
  </script>
</body>
</html>
